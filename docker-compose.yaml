services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flowchart_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backebd/SQL_scripts/create_tables.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/flowchart_db
      - APP_PORT=8080
      - JWT_SECRET=change-me
      - PASSWORD_PEPPER=change-me
      - ADMIN_LOGIN=admin
      - ADMIN_PASSWORD=admin
    depends_on:
      db:
        condition: service_healthy
        restart: true
             
  frontend:
    build:
      context: ./frontend
      args:
        - API_BASE_URL=http://localhost:8080
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
