services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # - ./backend/SQL_scripts/create_tables.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  migrate:
    image: migrate/migrate:v4.17.0
    volumes:
      - ./backend/db:/db
    command:
      - "-path"
      - "/db"
      - "-database"
      - "postgres://postgres:password@db:5432/flowchart_db?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - APP_PORT=${APP_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER}
      - ADMIN_LOGIN=${ADMIN_LOGIN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
             
  frontend:
    build:
      context: ./frontend
      args:
        - API_BASE_URL=
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  pgdata:
